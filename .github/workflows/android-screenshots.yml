# Real screenshots of the Android app: starts the bank API with demo data, boots an
# Android emulator, clicks through the app (ScreenshotTour) and uploads the images
# as the "lime-screenshots" artifact. Run it from the Actions tab ("Run workflow").
name: Android screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: gradle/actions/setup-gradle@v4

      - name: Start the bank API with demo data
        run: |
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/core-banking-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health > /dev/null && break; sleep 2; done
          bash .github/scripts/seed-demo.sh backend.log | tee -a "$GITHUB_ENV"

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Click through the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run-tour.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lime-screenshots
          path: shots/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-log
          path: backend.log
