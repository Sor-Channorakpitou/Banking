# Settings shared by every profile. Profile files (application-<profile>.yml) only hold
# what differs between environments, mostly the datasource.
spring:
  application:
    name: core-banking
  profiles:
    # "dev" (H2) unless SPRING_PROFILES_ACTIVE says otherwise, e.g. "postgres".
    default: dev
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it and
    # fails at startup if they drift apart, instead of silently altering tables.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB session open while the JSON response is rendered. Lazy loading
    # outside the service layer becomes an error you see early, not a hidden N+1.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    generator:
      # Money and rates as plain decimals (4090), never scientific notation (4.09E+3).
      write-bigdecimal-as-plain: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never

logging:
  pattern:
    # Every log line carries the request ID (and user ID once authenticated), so all
    # lines for one request can be found together. Set by RequestIdFilter.
    level: "%5p [req=%X{requestId:-} user=%X{userId:-}]"

management:
  endpoints:
    web:
      exposure:
        # health is public; the rest require ADMIN (see SecurityConfig).
        include: health, info, metrics, prometheus
  endpoint:
    health:
      # Component details (DB, disk) only for admins; everyone else sees just UP/DOWN.
      show-details: when-authorized
      roles: ADMIN
  metrics:
    tags:
      application: ${spring.application.name}

# Application settings, bound to the @ConfigurationProperties records in com.example.bank.config.
app:
  jwt:
    issuer: core-banking
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # secret: set per profile. Never commit a real secret; production reads JWT_SECRET.
  accounts:
    supported-currencies: [USD, EUR, KHR]
  exchange:
    # Published at startup only for pairs with no rate yet; admins publish new ones via the API.
    initial-rates:
      - base: USD
        quote: KHR
        buy-rate: 4090
        sell-rate: 4110
      - base: EUR
        quote: USD
        buy-rate: 1.07
        sell-rate: 1.11
  login-rate-limit:
    # Failed logins allowed per (email + IP) and per IP within the window.
    max-failures-per-account: 5
    max-failures-per-ip: 20
    window: 15m
