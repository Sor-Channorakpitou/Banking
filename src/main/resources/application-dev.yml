# Local development: file-based H2 so data survives restarts (stored in ./data).
# MODE=PostgreSQL makes H2 accept PostgreSQL syntax, so one set of Flyway scripts
# works on both databases.
spring:
  datasource:
    url: jdbc:h2:file:./data/bankdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Base64 of 32 random bytes (256 bits, the minimum for HS256). DEV ONLY.
    # Generate your own with: openssl rand -base64 32
    secret: nFHnlzq826XLyKQa10wclm0Y8jML+5T5W3R/jfjs9QU=
  security:
    # DEV ONLY. Generate your own with: openssl rand -base64 32
    data-key: 3q2+7wABAgMEBQYHCAkKCwwNDg8QERITFBUWFxgZGhs=
  # First admin account, created at startup if no user has this email.
  admin:
    email: admin@bank.local
    password: Admin123!
    full-name: Bank Administrator

management:
  endpoint:
    health:
      show-details: always
