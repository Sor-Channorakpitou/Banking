# Tests use a throwaway in-memory H2 database (fresh for each JVM).
spring:
  datasource:
    url: jdbc:h2:mem:bank-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
    username: sa
    password:

app:
  jwt:
    secret: dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQ=
  security:
    data-key: 3q2+7wABAgMEBQYHCAkKCwwNDg8QERITFBUWFxgZGhs=
    # Most tests aren't about verification; AccountSecurityIntegrationTest turns it on.
    require-verified-email: false
  limits:
    daily-outgoing:
      USD: 100000000
      EUR: 100000000
      KHR: 100000000000
  admin:
    email: admin@test.local
    password: Admin123!
    full-name: Test Admin

management:
  endpoint:
    health:
      show-details: always
